[project]
name = "tmx-api"
version = "0.1.0"
description = "TMX Enterprise AI Reference Platform — API transport layer (Sprint 0 foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # httpx: runtime dependency as of PBI-11-01 (fetches Entra ID's JWKS signing keys) — was
    # previously dev-only (TestClient's own transitive requirement).
    "httpx>=0.27,<1",
    # PyJWT[crypto] (pulls in `cryptography`): Entra ID access-token signature verification
    # (PBI-11-01) — RS256 only, never "none"/unsigned.
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["src"]
