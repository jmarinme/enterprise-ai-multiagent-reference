# TMX Enterprise AI Reference Platform — CI/CD pipeline.
#
# Delivery responsibility model (CLAUDE.md SS7.1, PBI-07-01): THIS FILE — not Claude Code — owns
# full regression, security gates, image build/push, infrastructure validation/deployment, DEV
# deployment, smoke tests, and deployment evidence. Claude Code's role, once this pipeline is
# operational, is limited to implementing code, targeted local tests/lint/type-check on changed
# areas, and documentation — never a routine manual `docker build`/`az containerapp update`/
# `az deployment group create` in place of a real pipeline run.
#
# Stage map (PBI-07-01's 6 requested stages, plus 1 bonus reporting stage — some YAML stages
# below split further for genuine parallelism/isolation reasons, documented at each one):
#   1 (Quality)        -> BackendQuality + FrontendQuality (parallel)
#   2 (Security)        -> SecurityScan (parallel with 1; gates stage 3)
#   3 (Build)           -> ContainerBuildValidation (PR validation against main — build only, no
#                          push, no Azure login) + ContainerBuildAndPush (main only — build +
#                          push combined — see that stage's own comment)
#   4 (Infrastructure)  -> InfrastructureValidation (4a, offline, every run) + InfrastructureDeploy
#                          (4b, isDeployRun only, quota-aware, never blocks stages 5-6)
#   5 (Deploy DEV)      -> DeployDev
#   6 (Smoke Tests)     -> SmokeTests
#   7 (bonus)           -> DeploymentSummary; ArtifactPublication (validation-only, every run)
#
# Sprint 0 (PBI-00-07) built the CI foundation (Quality + Infrastructure-Validate, deploy
# nothing). Sprint 04 (PBI-04-01) added real, automatic Continuous Deployment to the
# already-existing, already-operational DEV environment (rg-tmx-agent-platform-dev). Sprint 07
# (PBI-07-01) added Security, real (quota-aware) Infrastructure deployment, Web-only-when-changed
# builds, commit-SHA image traceability, and expanded Smoke Tests (correlation ID, conversation
# continuity, a Claims scenario, deployed-revision verification). PBI-07-01A reconciled all of
# the above with the Azure DevOps project/service connection actually created manually (see
# below). PBI-07-01B replaced the (never-used) `develop` branch assumption with this project's
# real branch model (`main`/`feat/*`/`fix/*`/`review/*`, no long-lived integration branch — see
# CLAUDE.md §15) and added `ContainerBuildValidation` so feature/fix/review branches get a real
# "does the image build" check without any Azure authentication or push. No new Azure
# environment (QA/Prod) is created; no existing Azure resource is redesigned or recreated. See
# docs/sprint_04/decisions.md and docs/sprint_07/decisions.md for the full design rationale.
#
# ============================================================================================
# IDENTITY MODEL (corrected, PBI-07-01A) — read this before touching RBAC anywhere in this repo
#
# The Azure DevOps service connection is "sc-tmx-agent-platform-dev" (Azure DevOps project
# "Enterprise-ai-multiagent-reference", org "tokio-marine-mx-devops"), ARM, Workload Identity
# Federation, created via Azure DevOps's "App registration (automatic)" flow — CONFIRMED (via
# `az ad sp show`/`az ad app federated-credential list`) to be backed by its OWN, freshly-created
# Entra ID App Registration (appId `e35d2b19-6ac8-41e5-af14-66a9095d4e35`, service principal
# object id `9f6190e9-b5dd-4651-a90b-45d9f37bcc5a`, display name
# "tokio-marine-mx-devops-Enterprise-ai-multiagent-referen-...") — this is a DIFFERENT principal
# from the platform's own user-assigned Managed Identity "id-tmxap-dev". PBI-07-01's original
# design incorrectly assumed the service connection would target id-tmxap-dev (per
# docs/sprint_00/security-baseline.md §6's original recommendation) — it does not, and every
# RBAC grant made to id-tmxap-dev for CI purposes (AcrPush, Container Apps Contributor —
# PBI-04-01) does NOT apply to the real pipeline identity.
#
# CONFIRMED (live `az role assignment list --resource-group rg-tmx-agent-platform-dev`): the
# real service-connection service principal already holds **Contributor**, scoped to
# rg-tmx-agent-platform-dev — granted automatically by Azure DevOps's own "automatic" WIF
# service-connection-creation flow at connection-creation time, OUTSIDE this repo's Bicep (a
# real RBAC grant that exists in Azure but is not currently codified as IaC — see
# docs/sprint_07/decisions.md PBI-07-01A entries for the full evidence chain and the drift this
# implies). Contributor's own definition (`Actions: ["*"]`, excluding only
# Microsoft.Authorization/*/write and a few Blueprint/Purview actions) already covers every
# capability ContainerBuildAndPush (ACR push)/DeployDev (Container App update)/InfrastructureDeploy
# (Bicep resource deployment, excluding role assignments) need — no further RBAC grant is
# required for this pipeline to function, on any identity, right now.
#
# ops/bicep/main.bicep's `cicdInfrastructureContributorPrincipalId` param (PBI-07-01) remains
# off by default (empty string) — it exists only as an OPTIONAL way to bring the
# already-existing, externally-granted Contributor role under this repo's IaC control in the
# future (pointing it at the real SP object id above, not id-tmxap-dev), never as something this
# pipeline or Claude Code applies automatically. id-tmxap-dev's own PBI-04-01 AcrPush/Container
# Apps Contributor grants remain in place (harmless, unused by CI) — removing them is a separate,
# not-yet-authorized cleanup, not done here.
# ============================================================================================
#
# ============================================================================================
# PREREQUISITES — must exist before the deploy-affecting stages
# (ContainerBuildAndPush/InfrastructureDeploy/DeployDev/SmokeTests/DeploymentSummary) can run
# for real. Full walkthrough: docs/sprint_07/azure-devops-setup.md. Summary:
#
#   1. Azure DevOps organization + project — DONE ("tokio-marine-mx-devops" /
#      "Enterprise-ai-multiagent-reference").
#   2. The ARM service connection ("${{ parameters.azureServiceConnection }}", default:
#      sc-tmx-agent-platform-dev), Workload Identity Federation, no client secret, no publish
#      profile, no service principal password — DONE. See the IDENTITY MODEL block above for
#      exactly which principal this is and what RBAC it already holds.
#   3. This Git repository connected to the Azure DevOps project (GitHub connection, if hosted
#      on GitHub, or an Azure Repos import) — NOT YET DONE.
#   4. The pipeline itself created from this YAML file, and authorized to use the service
#      connection (Azure Pipelines requires a one-time manual "Permit" click the first time a
#      pipeline run actually attempts to use a service connection it hasn't used before) — NOT
#      YET DONE.
#   5. No further RBAC grant is required for a first run to exercise every stage, including
#      InfrastructureDeploy — the service connection's principal already holds Contributor on
#      rg-tmx-agent-platform-dev (see IDENTITY MODEL above). This is unverified against a REAL
#      pipeline run (every check so far used the human user's own Owner-level `az` session, not
#      a live OIDC token exchange through this exact service connection) — treat as a strong
#      hypothesis, not a certainty, until the first real run confirms it.
#
# Until 3-4 are done, BackendQuality/FrontendQuality/SecurityScan/InfrastructureValidation still
# run and validate every push/PR exactly as before — only the deploy-affecting stages require
# them.
# ============================================================================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "**/*.md"

pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main
  paths:
    exclude:
      - docs/**
      - "**/*.md"

parameters:
  - name: bicepModuleFiles
    type: object
    default:
      - ops/bicep/main.bicep
      - ops/bicep/modules/app-insights.bicep
      - ops/bicep/modules/ai-search.bicep
      - ops/bicep/modules/azure-openai.bicep
      - ops/bicep/modules/container-app.bicep
      - ops/bicep/modules/container-apps-environment.bicep
      - ops/bicep/modules/container-registry.bicep
      - ops/bicep/modules/cosmos-db.bicep
      - ops/bicep/modules/key-vault.bicep
      - ops/bicep/modules/key-vault-secret.bicep
      - ops/bicep/modules/log-analytics.bicep
      - ops/bicep/modules/managed-identity.bicep
      - ops/bicep/modules/private-dns-zone.bicep
      - ops/bicep/modules/private-endpoint.bicep
      - ops/bicep/modules/virtual-network.bicep
  - name: bicepParameterFiles
    type: object
    default:
      - ops/bicep/parameters/dev.bicepparam
      - ops/bicep/parameters/staging.bicepparam
      - ops/bicep/parameters/prod.bicepparam
  # Name of the Azure DevOps service connection created per the PREREQUISITE above. A
  # parameter, not a hardcoded literal inline in every deploy step, so renaming it means
  # changing one line, not hunting through the file. Real value, confirmed live (PBI-07-01A) —
  # see the IDENTITY MODEL block above for exactly which principal backs it.
  - name: azureServiceConnection
    type: string
    default: 'sc-tmx-agent-platform-dev'
  # The only Azure resource NAME hardcoded anywhere in this file: the resource group itself.
  # It has no generated suffix, was deliberately chosen, and is the unavoidable entry point
  # for every dynamic lookup below (ACR name, Container App names, FQDNs — all resolved via
  # `az ... list/show` queries scoped to this resource group, never hardcoded).
  - name: resourceGroupName
    type: string
    default: 'rg-tmx-agent-platform-dev'
  # Only pushes to this branch trigger the deploy-affecting stages (ContainerBuildAndPush,
  # InfrastructureDeploy, DeployDev, SmokeTests, DeploymentSummary). PR validation builds
  # (which always target main — see the `pr:` trigger above; the `trigger:` block only fires
  # on pushes to `main` — feat/*/fix/*/review/* branches no longer run CI on push, only once a
  # PR against main exists, to avoid duplicate runs against free-tier CI minutes) still run
  # Quality/Security/ContainerBuildValidation/Infrastructure-Validate but never deploy — this
  # project has no `develop` branch (PBI-07-01B); DEV tracks `main` only, reviewed/merged
  # changes, never an individual feature branch (CLAUDE.md §15's branch model:
  # `feature/*`/`fix/*`/`review/*` off `main`, no long-lived integration branch).
  - name: deployBranch
    type: string
    default: 'main'

variables:
  pythonVersion: '3.12'
  nodeVersion: '20.x'
  apiImageName: 'tmx-api'
  webImageName: 'tmx-web'
  # Image versioning (PBI-04-01 requirement — never "latest"): Build.BuildId is unique and
  # monotonically increasing per Azure DevOps project with zero extra setup. Prefixed with
  # "dev-" purely for readability when browsing tags in the registry. PBI-07-01 appends the
  # full commit SHA (Build.SourceVersion) so every image tag maps back to an exact commit
  # without needing to cross-reference the Azure DevOps build history — "preserve commit/build
  # traceability in image tags" (docker tags allow up to 128 chars; this is well under that).
  imageTag: 'dev-$(Build.BuildId)-$(Build.SourceVersion)'
  # appVersion (PBI-14-06): the maintained, human-readable release identifier baked into both
  # images at build time (GET /version's app_version, apps/api/src/config/settings.py's own
  # default, and apps/web's Sidebar version indicator) — kept in sync with those defaults by
  # hand, same as this file's own imageTag doesn't need external input either. Never used as a
  # substitute for the real per-build identity (Build.BuildNumber/Build.SourceVersion below),
  # only as the "which sprint/PBI shipped this" label.
  appVersion: '14.6.0'
  isDeployRun: $[eq(variables['Build.SourceBranch'], 'refs/heads/${{ parameters.deployBranch }}')]

stages:
  # ============================================================================================
  # PBI-07-01 STAGE 1 (Quality) — Backend
  # Validates both Python projects in this repo (apps/api's transport layer and the root
  # src/ domain library) in one shared environment. Fails immediately on any pytest/ruff/mypy
  # failure — each is its own step; a failing step stops the job before the next one runs.
  # ============================================================================================
  - stage: BackendQuality
    displayName: '1a - Quality: Backend (checkout, Python env, quality gates)'
    jobs:
      - job: BackendQualityJob
        displayName: Backend quality gate
        pool:
          vmImage: ubuntu-latest
        variables:
          PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          # Package caching (PBI-04-01 requirement): keyed on both pyproject.toml files, so a
          # dependency change invalidates the cache automatically; restoreKeys falls back to
          # the most recent cache for this OS otherwise, keeping installs fast without ever
          # serving stale packages for an unchanged dependency set.
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | apps/api/pyproject.toml | pyproject.toml'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: 'Cache pip packages'

          - script: python -m pip install --cache-dir $(PIP_CACHE_DIR) --upgrade pip
            displayName: 'Upgrade pip'

          - script: |
              set -e
              # apps/api/pyproject.toml dependencies + dev extras
              pip install --cache-dir $(PIP_CACHE_DIR) \
                "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1" \
                "pydantic>=2.7,<3" "pydantic-settings>=2.3,<3" \
                "pytest>=8.2,<9" "httpx>=0.27,<1" "ruff>=0.5,<1" "mypy>=1.10,<2" \
                "PyJWT[crypto]>=2.9,<3"
              # root pyproject.toml dependencies + dev/cosmos/keyvault/azureopenai/azuresearch extras
              pip install --cache-dir $(PIP_CACHE_DIR) \
                "pytest-asyncio>=0.23,<1" "types-PyYAML>=6.0,<7" \
                "azure-cosmos>=4.7,<5" "azure-identity>=1.17,<2" \
                "azure-keyvault-secrets>=4.8,<5" "openai>=1.40,<2" "aiohttp>=3.9,<4" \
                "azure-search-documents>=11.5,<12"
              # coverage publication (Stage 1 requirement: "publish coverage if available")
              pip install --cache-dir $(PIP_CACHE_DIR) "pytest-cov>=5,<7"
            displayName: 'Install backend and root project dependencies'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/backend-reports"
              python -m pytest \
                tests/ \
                -v \
                --junitxml="$(Build.ArtifactStagingDirectory)/backend-reports/junit.xml" \
                --cov=src --cov=apps/api/src \
                --cov-report=xml:"$(Build.ArtifactStagingDirectory)/backend-reports/coverage.xml" \
                --cov-report=term
            displayName: 'Run full pytest suite (quality gate 1/3 — fails the job immediately on any test failure)'

          - script: |
              set -e
              # ruff resolves [tool.ruff] from the nearest ancestor pyproject.toml per file, so
              # apps/api/src correctly picks up its own FastAPI Depends() lint exception while
              # src/ and tests/ use the root config — one command covers both trees correctly.
              python -m ruff check apps/api/src src tests ops/scripts
            displayName: 'Run ruff (quality gate 2/3)'

          - script: |
              set -e
              python -m mypy apps/api/src
              python -m mypy src
            displayName: 'Run mypy (quality gate 3/3)'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/backend-reports/junit.xml'
              testRunTitle: 'Backend (full pytest suite)'
            displayName: 'Publish backend test results'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Build.ArtifactStagingDirectory)/backend-reports/coverage.xml'
            displayName: 'Publish backend coverage (if available)'

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend-reports'
              artifactName: 'backend-reports'
            displayName: 'Publish backend-reports artifact'

  # ============================================================================================
  # PBI-07-01 STAGE 1 (Quality) — Frontend (parallel with Backend Quality; both gate Build)
  # ============================================================================================
  - stage: FrontendQuality
    displayName: '1b - Quality: Frontend'
    jobs:
      - job: FrontendQualityJob
        displayName: Frontend quality gate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Use Node $(nodeVersion)'

          # Package caching (PBI-04-01 requirement), keyed on package-lock.json.
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | apps/web/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: apps/web/node_modules
            displayName: 'Cache npm packages'

          - script: npm ci
            workingDirectory: apps/web
            displayName: 'npm ci'

          - script: npm run lint
            workingDirectory: apps/web
            displayName: 'Run frontend lint'

          - script: npm run typecheck
            workingDirectory: apps/web
            displayName: 'Run frontend typecheck'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/frontend-reports"
              npm run test -- --reporter=junit --outputFile="$(Build.ArtifactStagingDirectory)/frontend-reports/junit.xml"
            workingDirectory: apps/web
            displayName: 'Run frontend unit tests'

          - script: npm run build
            workingDirectory: apps/web
            displayName: 'Run production build'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '$(Build.ArtifactStagingDirectory)/frontend-reports/junit.xml'
              testRunTitle: 'Frontend (Vitest)'
            displayName: 'Publish frontend test results'

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/frontend-reports'
              artifactName: 'frontend-reports'
            displayName: 'Publish frontend-reports artifact'

          - task: PublishPipelineArtifact@1
            condition: succeeded()
            inputs:
              targetPath: 'apps/web/dist'
              artifactName: 'web-build'
            displayName: 'Publish Web production build'

  # ============================================================================================
  # PBI-07-01 STAGE 2 — Security
  # Resolves Architecture Review Finding SEC-08 (reports/review/02_security_review.md): "no
  # dependency or container vulnerability scanning exists anywhere in azure-pipelines.yml."
  # Three lightweight, single-purpose tools — no heavyweight/enterprise product:
  #   - pip-audit (official PyPA tool) — Python runtime dependency CVEs.
  #   - npm audit (built into npm, zero extra install) — frontend dependency CVEs.
  #   - detect-secrets (Yelp, pip-installable) — committed-secret scan.
  # Runs in parallel with BackendQuality/FrontendQuality (no dependsOn — disjoint concern);
  # gates ContainerBuildAndPush exactly like the quality stages do (see that stage's dependsOn).
  # ============================================================================================
  - stage: SecurityScan
    displayName: '2 - Security (dependency + secret scanning)'
    jobs:
      - job: SecurityScanJob
        displayName: Security gates
        pool:
          vmImage: ubuntu-latest
        variables:
          PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - task: Cache@2
            inputs:
              key: 'pip-security | "$(Agent.OS)" | apps/api/pyproject.toml | pyproject.toml'
              restoreKeys: |
                pip-security | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: 'Cache pip packages'

          - script: |
              set -e
              python -m pip install --cache-dir $(PIP_CACHE_DIR) --upgrade pip
              # Same runtime dependency set BackendQuality installs — pip-audit audits the
              # environment it runs in, not pyproject.toml text, so the real installed set must
              # match what actually ships/runs, not a superset (this repo has no lock file; see
              # reports/review/02_security_review.md Finding SEC-08's own note on that gap).
              pip install --cache-dir $(PIP_CACHE_DIR) \
                "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1" \
                "pydantic>=2.7,<3" "pydantic-settings>=2.3,<3" \
                "pytest>=8.2,<9" "httpx>=0.27,<1" \
                "pytest-asyncio>=0.23,<1" \
                "azure-cosmos>=4.7,<5" "azure-identity>=1.17,<2" \
                "azure-keyvault-secrets>=4.8,<5" "openai>=1.40,<2" "aiohttp>=3.9,<4" \
                "azure-search-documents>=11.5,<12" \
                "PyJWT[crypto]>=2.9,<3" \
                "pytest-cov>=5,<7"
              pip install --cache-dir $(PIP_CACHE_DIR) "pip-audit>=2.7,<3" "detect-secrets>=1.5,<2"
              # setuptools ships bundled with every venv (packaging/build tooling, not a
              # declared project dependency, never imported by application code) but pip-audit
              # still flags an outdated bundled copy — real, current findings confirmed locally
              # 2026-08-10 (PYSEC-2022-43012/PYSEC-2025-49/PYSEC-2026-1918/PYSEC-2026-3447 on
              # setuptools 65.5.0). Upgrading it is a zero-risk, zero-compatibility-impact fix
              # (it never affects apps/api/pyproject.toml's own declared versions), unlike the
              # pytest finding below.
              pip install --cache-dir $(PIP_CACHE_DIR) --upgrade "setuptools>=78.1.1"
            displayName: 'Install runtime dependencies + security tools'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"
              echo "=== pip-audit: scanning installed environment for known CVEs ==="
              # PYSEC-2026-1845 (pytest 8.4.2, fixed only in pytest 9.x): apps/api/pyproject.toml
              # pins pytest>=8.2,<9 deliberately (this repo's whole test suite is un-validated
              # against pytest 9's breaking changes) — a real, separately-scoped upgrade
              # decision, not something this CI/CD PBI should make unilaterally. pytest also
              # never ships in the deployed container (test-only tool). Ignored here, with this
              # justification, not silently — everything else in the real, installed dependency
              # set must still pass with zero exceptions.
              pip-audit --desc --ignore-vuln PYSEC-2026-1845 \
                | tee "$(Build.ArtifactStagingDirectory)/security-reports/pip-audit.txt"
            displayName: 'Python dependency vulnerability scan (pip-audit) — gate 1/3'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"
              echo "=== detect-secrets scan: tracked repository content ==="
              # docs/**/evidence/*.txt are frozen, historical raw CLI-output transcripts (Sprint
              # validation records — CLAUDE.md SS12's "do not erase previous entries") that
              # legitimately contain high-entropy content with no security meaning (Ollama model
              # digests, OpenAI tool-call IDs) — confirmed by hand, 2026-08-10, not guessed. All
              # actual source/test/config findings (5, all "Secret Keyword" false positives on
              # parameter/variable NAMES like secretName/SecretProvider, never a value) are
              # suppressed inline via `pragma: allowlist secret` at their exact line, auditable
              # in code review — no repo-wide baseline file needed.
              # No --all-files: that flag scans the raw filesystem recursively, which descends
              # into .git/ (FETCH_HEAD's commit SHA is a 40-char hex string — a "Hex High
              # Entropy String" false positive on internal git metadata, never versioned code)
              # and ignores .gitignore (node_modules/, venv/, __pycache__/, dist/, build/,
              # artifacts/). Omitting it scans git-tracked files only — detect-secrets' own
              # documented default — which is the correct scope for a committed-secrets gate.
              detect-secrets scan --exclude-files 'docs/.*/evidence/.*' \
                > "$(Build.ArtifactStagingDirectory)/security-reports/detect-secrets.json"
              python3 -c "
              import json
              report = json.load(open('$(Build.ArtifactStagingDirectory)/security-reports/detect-secrets.json'))
              results = report.get('results', {})
              if results:
                  print('POTENTIAL SECRETS FOUND (not suppressed by an existing pragma comment):')
                  for path, findings in results.items():
                      for f in findings:
                          print(f\"  {path}:{f['line_number']} - {f['type']}\")
                  raise SystemExit(1)
              print('No potential secrets found.')
              "
            displayName: 'Secret scan (detect-secrets) — gate 2/3'

          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Use Node $(nodeVersion)'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | apps/web/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: apps/web/node_modules
            displayName: 'Cache npm packages'

          - script: npm ci
            workingDirectory: apps/web
            displayName: 'npm ci'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"
              echo "=== npm audit (full, informational): all dependencies including devDependencies ==="
              # Non-blocking (continueOnError below): confirmed 2026-08-10 this currently reports
              # 5 findings (1 critical, 1 high, 3 moderate), all transitively via
              # esbuild/vite/vitest (devDependencies only — the Vite dev server, never shipped
              # in the production build apps/web/Dockerfile actually serves); fixing requires
              # `npm audit fix --force` (a breaking Vite major-version bump) — an out-of-scope
              # build-toolchain upgrade, not a CI/CD pipeline change. Published for visibility,
              # not silently hidden.
              npm audit --audit-level=high \
                | tee "$(Build.ArtifactStagingDirectory)/security-reports/npm-audit-full.txt" || true
            displayName: 'npm dependency scan — full report (informational, non-blocking)'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/security-reports"
              echo "=== npm audit --omit=dev: production dependencies only (react, react-dom) ==="
              # The real gate: production dependencies (what actually ships in the built app)
              # must be clean at high/critical severity. Confirmed clean (0 vulnerabilities)
              # 2026-08-10.
              npm audit --omit=dev --audit-level=high \
                | tee "$(Build.ArtifactStagingDirectory)/security-reports/npm-audit-prod.txt"
            displayName: 'npm dependency vulnerability scan (production deps) — gate 3/3'

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/security-reports'
              artifactName: 'security-reports'
            displayName: 'Publish security-reports artifact'

  # ============================================================================================
  # PBI-07-01 STAGE 4a (Infrastructure — Validate half)
  # Compiles every Bicep module, main.bicep, and all environment parameter files. No Azure
  # login, no `az deployment create`, no `az deployment what-if`. Runs in parallel with
  # Stages 1-2 (no dependsOn) since it validates a disjoint file set. See InfrastructureDeploy
  # below for the "deploy" half (isDeployRun-only, requires new RBAC, quota-aware).
  # ============================================================================================
  - stage: InfrastructureValidation
    displayName: '4a - Infrastructure: Validate (offline Bicep build, every run)'
    jobs:
      - job: InfrastructureValidationJob
        displayName: Validate Bicep
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: az bicep install
            displayName: 'Install Bicep CLI'

          - ${{ each bicepFile in parameters.bicepModuleFiles }}:
              - template: azure-pipelines/templates/steps/bicep-build.yml
                parameters:
                  filePath: ${{ bicepFile }}

          - ${{ each paramFile in parameters.bicepParameterFiles }}:
              - template: azure-pipelines/templates/steps/bicep-build-params.yml
                parameters:
                  filePath: ${{ paramFile }}

  # ============================================================================================
  # PBI-07-01 STAGE 4b (Infrastructure — Deploy half)
  # Runs `az deployment group validate` then `az deployment group create` against the real DEV
  # resource group, for pushes to the deploy branch only. Needs a broader RBAC grant than
  # ContainerBuildAndPush/DeployDev — Contributor scoped to rg-tmx-agent-platform-dev only.
  # (PBI-07-01A, corrected): the real service connection principal ALREADY holds this role —
  # granted automatically by Azure DevOps at service-connection-creation time, confirmed live
  # (see this file's own IDENTITY MODEL header block) — no Bicep-driven grant is required for
  # this stage to authenticate and deploy. `ops/bicep/main.bicep`'s
  # `cicdInfrastructureContributorPrincipalId` param stays off by default; it exists only to
  # optionally codify this already-existing external grant into IaC later, never to grant it to
  # id-tmxap-dev (a different, unrelated identity). If this stage still fails with an
  # authorization error on a real run, treat that as evidence the hypothesis above needs
  # revisiting (docs/sprint_07/decisions.md), not as "the prerequisite isn't done yet."
  #
  # Deliberately INDEPENDENT of DeployDev/SmokeTests (dependsOn is InfrastructureValidation
  # only, and DeployDev's own dependsOn does NOT include this stage): infra-deploy problems —
  # the still-open Microsoft.Web/serverFarms quota block, or the new RBAC not being granted yet
  # — must never block unrelated API/Web container delivery. Enforced structurally (this stage
  # is simply not on DeployDev's dependency graph at all), not only by the error-handling script
  # below — belt and suspenders, per this PBI's explicit requirement.
  #
  # Error handling: only ONE specific, empirically-confirmed condition is treated as
  # known/non-blocking (a warning, exit 0) — SubscriptionIsOverQuotaForSku on
  # Microsoft.Web/serverFarms (the Claims Tool Layer Function App's App Service Plan), which
  # this subscription cannot currently provision — an external Azure quota limitation, not a
  # code or pipeline defect (docs/Architecture/adr/0003-azure-functions-tool-and-workflow-layer.md,
  # docs/sprint_06/decisions.md D-07 — confirmed via 3 independent real `az deployment group
  # create` attempts, 2026-08-09/10). main.bicep is idempotent and ARM applies every OTHER
  # resource in the template independently of that one failure — confirmed each of those 3
  # times: every non-blocked resource (Storage Account, role assignments, etc.) was successfully
  # applied even though the overall deployment's exit code was 1. Any OTHER failure (a real
  # Bicep defect, an authorization error, a different Azure error) fails this stage for real —
  # this script never blanket-swallows errors, only this one documented, evidenced condition.
  # ============================================================================================
  - stage: InfrastructureDeploy
    displayName: '4b - Infrastructure: Deploy (DEV only, quota-aware, never blocks Deploy/Smoke)'
    dependsOn:
      - InfrastructureValidation
    condition: and(succeeded(), eq(variables.isDeployRun, true))
    jobs:
      - job: InfrastructureDeployJob
        displayName: Deploy DEV infrastructure changes (main.bicep)
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'az deployment group validate + create (quota-aware, non-blocking for known blocker)'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                # PBI-14-11: read the currently-deployed image (tag or digest) for each existing
                # Container App and feed it back as an override BEFORE applying Bicep, so this
                # infrastructure deploy is a no-op for image identity whenever the app already
                # exists. Ownership boundary: infrastructure deploys must never overwrite the
                # application image identity that DeployDev (a separate, later stage) owns.
                # Previously apiImageTag/webImageTag came only from dev.bicepparam's hardcoded
                # 'pending-first-build' placeholder, and modules/container-app.bicep binds a full
                # (non-`existing`) Container App resource's `image` directly to that value — every
                # apply reset both Container Apps back to the placeholder, made safe only by
                # DeployDev's later PBI-14-08 sequencing dependency re-correcting it afterward in
                # the same run. That made correctness depend on pipeline stage ordering rather
                # than on infrastructure deploys being genuinely idempotent for a property
                # application deployment owns. The placeholder is now used only on true first
                # bootstrap (the Container App does not exist yet) — never on an ordinary
                # redeploy, regardless of whether InfrastructureDeploy or DeployDev happens to run
                # first in a given pipeline execution.
                resolve_current_image_override() {
                  local name_suffix="$1"
                  local out_tag_var="$2"
                  local out_digest_var="$3"

                  local app_name
                  app_name=$(az containerapp list --resource-group "${{ parameters.resourceGroupName }}" --query "[?ends_with(name, '$name_suffix')].name | [0]" -o tsv 2>/dev/null || echo "")
                  if [ -z "$app_name" ]; then
                    echo "No existing Container App ending in '$name_suffix' — true first bootstrap, dev.bicepparam's placeholder tag applies."
                    printf -v "$out_tag_var" '%s' ""
                    printf -v "$out_digest_var" '%s' ""
                    return
                  fi

                  local current_image
                  current_image=$(az containerapp show --name "$app_name" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.template.containers[0].image" -o tsv)
                  echo "Existing Container App '$app_name' currently runs: $current_image"
                  case "$current_image" in
                    *@sha256:*)
                      printf -v "$out_digest_var" '%s' "${current_image##*@}"
                      printf -v "$out_tag_var" '%s' ""
                      ;;
                    *)
                      printf -v "$out_tag_var" '%s' "${current_image##*:}"
                      printf -v "$out_digest_var" '%s' ""
                      ;;
                  esac
                }

                resolve_current_image_override "-api" API_TAG_OVERRIDE API_DIGEST_OVERRIDE
                resolve_current_image_override "-web" WEB_TAG_OVERRIDE WEB_DIGEST_OVERRIDE

                echo "Resolved overrides: apiImageTag='${API_TAG_OVERRIDE:-<bicepparam default>}' apiImageDigest='${API_DIGEST_OVERRIDE:-<none>}' webImageTag='${WEB_TAG_OVERRIDE:-<bicepparam default>}' webImageDigest='${WEB_DIGEST_OVERRIDE:-<none>}'"

                IMAGE_OVERRIDE_ARGS=()
                [ -n "$API_TAG_OVERRIDE" ] && IMAGE_OVERRIDE_ARGS+=(apiImageTag="$API_TAG_OVERRIDE")
                [ -n "$API_DIGEST_OVERRIDE" ] && IMAGE_OVERRIDE_ARGS+=(apiImageDigest="$API_DIGEST_OVERRIDE")
                [ -n "$WEB_TAG_OVERRIDE" ] && IMAGE_OVERRIDE_ARGS+=(webImageTag="$WEB_TAG_OVERRIDE")
                [ -n "$WEB_DIGEST_OVERRIDE" ] && IMAGE_OVERRIDE_ARGS+=(webImageDigest="$WEB_DIGEST_OVERRIDE")

                DEPLOY_PARAMS=(--parameters ops/bicep/parameters/dev.bicepparam)
                if [ ${#IMAGE_OVERRIDE_ARGS[@]} -gt 0 ]; then
                  DEPLOY_PARAMS+=(--parameters "${IMAGE_OVERRIDE_ARGS[@]}")
                fi

                echo "=== az deployment group validate ==="
                az deployment group validate \
                  --resource-group "${{ parameters.resourceGroupName }}" \
                  --template-file ops/bicep/main.bicep \
                  "${DEPLOY_PARAMS[@]}"

                echo "=== az deployment group create ==="
                set +e
                DEPLOY_OUTPUT=$(az deployment group create \
                  --resource-group "${{ parameters.resourceGroupName }}" \
                  --name "pipeline-infra-$(Build.BuildId)" \
                  --template-file ops/bicep/main.bicep \
                  "${DEPLOY_PARAMS[@]}" \
                  -o json 2>&1)
                DEPLOY_EXIT=$?
                set -e

                echo "$DEPLOY_OUTPUT"

                if [ $DEPLOY_EXIT -ne 0 ]; then
                  if echo "$DEPLOY_OUTPUT" | grep -q "SubscriptionIsOverQuotaForSku" && \
                     echo "$DEPLOY_OUTPUT" | grep -q "Microsoft.Web/serverFarms"; then
                    echo "##vso[task.logissue type=warning]Known external blocker: the Claims Tool Layer Function App (Microsoft.Web/serverFarms) could not be provisioned — this subscription reports SubscriptionIsOverQuotaForSku (0 App Service quota, confirmed across 5 regions, 3 independent real deployment attempts). This is an EXTERNAL Azure subscription limitation, not a pipeline, Bicep, or application defect — see docs/Architecture/adr/0003-azure-functions-tool-and-workflow-layer.md and docs/sprint_06/decisions.md D-07. Every OTHER resource in main.bicep still deploys successfully (ARM applies independent resources even when one nested deployment fails). Resolving this requires an Azure Support App Service quota-increase request — no pipeline or code change can work around it. This does NOT affect API/Web delivery (Stages 5-6 continue regardless of this stage's outcome)."
                    echo "Infrastructure deploy: PARTIAL — all resources except the quota-blocked Function App applied. Treated as non-blocking (documented, expected). See warning above."
                    echo "##vso[task.setvariable variable=infraDeployResult;isOutput=true]partial-quota-blocked"
                    exit 0
                  else
                    echo "Infrastructure deploy failed for a reason OTHER than the known Function App quota block — a real failure, not a documented/expected condition. Failing this stage."
                    echo "##vso[task.setvariable variable=infraDeployResult;isOutput=true]failed"
                    exit 1
                  fi
                fi

                echo "Infrastructure deploy: fully succeeded, including the Function App (subscription quota must have been granted since docs/sprint_06/decisions.md D-07)."
                echo "##vso[task.setvariable variable=infraDeployResult;isOutput=true]succeeded"
            name: infraDeploy

  # ============================================================================================
  # PBI-07-01B STAGE 3 (Build) — validation half, PR-against-main branches
  # Requirement 3 ("feat/fix/review branches must run CI validation only... they may run:
  # Quality, Security, Build, Infrastructure validation") + requirement 4 (deployment stages —
  # InfrastructureDeploy/DeployDev/SmokeTests — main-only) together mean Build itself belongs on
  # feature branches too, but strictly as a "does this image build" check — no ACR login, no
  # push, no Azure authentication of any kind, nothing this identity could use to affect Azure.
  # Plain `docker build`, discarded when the job ends. Deliberately the mirror image of
  # ContainerBuildAndPush below: runs when isDeployRun is NOT true (every PR against main — the
  # `trigger:` block only fires on `main` itself, so a bare feat/*/fix/*/review/* push no longer
  # runs this stage on its own) so main never redundantly builds twice — ContainerBuildAndPush's
  # own (superset) build+push already covers main.
  # ============================================================================================
  - stage: ContainerBuildValidation
    displayName: '3 - Build (validation only — no push, no Azure login, non-main branches)'
    dependsOn:
      - BackendQuality
      - FrontendQuality
      - SecurityScan
    condition: and(succeeded(), ne(variables.isDeployRun, true))
    jobs:
      - job: ContainerBuildValidationJob
        displayName: Build API/Web images locally (no push)
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 2

          - script: |
              set -e
              echo "=== Building API image (validation only, repo-root context — see apps/api/Dockerfile) ==="
              docker build \
                --file apps/api/Dockerfile \
                -t "$(apiImageName):ci-validation" \
                .
              echo "API image builds successfully."
            displayName: 'docker build: API image (no push)'

          - script: |
              set -e
              # Same "only when relevant" comparison ContainerBuildAndPush/DeployDev use for the
              # real build — kept independent (not a cross-stage variable) since this stage must
              # be usable standalone, without ContainerBuildAndPush ever running (it never runs
              # on these branches).
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD -- apps/web | grep -q .; then
                  WEB_CHANGED=true
                else
                  WEB_CHANGED=false
                fi
              else
                echo "No parent commit found (first commit in history) — defaulting to changed=true."
                WEB_CHANGED=true
              fi
              echo "apps/web changed since parent commit: $WEB_CHANGED"
              if [ "$WEB_CHANGED" = "true" ]; then
                echo "=== Building Web image (validation only; VITE_API_URL uses the Dockerfile's own default — no real deployed API exists on this branch) ==="
                docker build \
                  -t "$(webImageName):ci-validation" \
                  apps/web
                echo "Web image builds successfully."
              else
                echo "Skipping Web image build — apps/web unchanged since parent commit."
              fi
            displayName: 'docker build: Web image (no push, only when apps/web changed)'

  # ============================================================================================
  # PBI-07-01 STAGE 3 — Build (build + push, combined into one YAML
  # stage/job deliberately: Azure Pipelines stages do not share a filesystem/Docker image
  # cache across stage boundaries (each stage may run on a different agent instance), so
  # "build in one stage, push in a separate stage" would require save/publish/download-ing a
  # multi-hundred-MB tarball purely to satisfy a stage-per-numbered-item mapping — pure
  # overhead with no benefit for a DEV-only, non-approval-gated flow. Build and Push remain
  # two clearly separated, independently-named step groups below.
  #
  # Runs only for the deploy branch (isDeployRun) — PR validation (always against main) stops
  # after Stages 1/2/4a (Quality/Security/Infrastructure-Validate) plus the build-only
  # ContainerBuildValidation stage above, exactly as before (this project has no `develop`
  # branch — PBI-07-01B). A bare feat/*/fix/*/review/* push no longer runs any of this at all —
  # only main pushes and PRs against main trigger the pipeline.
  #
  # Fixes a pre-existing bug in this pipeline: the Sprint-0 version of this stage built the
  # API image with `./apps/api` as the Docker build context. apps/api/Dockerfile has required
  # the REPO ROOT as its build context since PBI-03-02 (main.py depends on the shared,
  # reusable src/ packages) — the old context could never have produced a working image. See
  # docs/sprint_04/decisions.md.
  #
  # PBI-14-05: this stage now ALWAYS builds and pushes BOTH images, unconditionally. The
  # previous "build Web only when apps/web changed since HEAD^" optimization was correct in
  # intent (save CI minutes) but wrong in scope: applying it to the actual main/DEV delivery
  # path (not just PR validation) meant any main push whose own single commit didn't happen to
  # touch apps/web (a backend-only PBI merged after an earlier PBI's frontend fix, docs-only
  # merges, etc.) silently left the previously-built Web image running in DEV — producing a
  # DEV environment where API and Web came from DIFFERENT commits, most visibly as the Vite
  # "Blocked request" regression (see apps/web/vite.config.ts's own PBI-08-02 comment — this
  # exact drift already happened once before). ContainerBuildValidation above (PR-only, never
  # deploys anything) KEEPS the webChanged optimization — it only affects CI minutes on
  # validation runs, never DEV's actual deployed state. See ADR-0014's sibling
  # docs/sprint_14/decisions.md PBI-14-05 entry for the full before/after evidence.
  # ============================================================================================
  - stage: ContainerBuildAndPush
    displayName: '3 - Build (image build + push to ACR — API and Web, always both)'
    dependsOn:
      - BackendQuality
      - FrontendQuality
      - SecurityScan
    condition: and(succeeded(), eq(variables.isDeployRun, true))
    jobs:
      - job: ContainerBuildAndPushJob
        displayName: Build and push API and Web images
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 2

          - script: |
              set -e
              # PBI-14-05: informational only — this no longer gates whether the Web image is
              # built/pushed/deployed (see the stage-level comment above). Retained solely so
              # DeploymentSummary can report whether apps/web literally changed in this push's
              # own commit, for audit/context purposes; it must never again be wired to skip a
              # build or deploy step.
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                if git diff --name-only HEAD^ HEAD -- apps/web | grep -q .; then
                  WEB_CHANGED=true
                else
                  WEB_CHANGED=false
                fi
              else
                echo "No parent commit found (first commit in history) — defaulting to changed=true."
                WEB_CHANGED=true
              fi
              echo "apps/web changed since parent commit (informational only): $WEB_CHANGED"
              echo "##vso[task.setvariable variable=webChangedInfoOnly;isOutput=true]$WEB_CHANGED"
            name: detectWebChange
            displayName: 'Detect whether apps/web changed since the parent commit (informational only — does not gate build/deploy)'

          - task: AzureCLI@2
            displayName: 'Resolve existing ACR + API Container App FQDN, build, and push both images (always)'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                # Dynamic resolution (no hardcoded generated resource names): the resource
                # group name is the only fixed input; the ACR and the API Container App's
                # current FQDN are looked up by resource type/name-suffix within it, so a
                # future re-deploy that changes the generated uniqueString() suffix never
                # requires a pipeline edit.
                ACR_NAME=$(az acr list --resource-group "${{ parameters.resourceGroupName }}" --query "[0].name" -o tsv)
                ACR_LOGIN_SERVER=$(az acr list --resource-group "${{ parameters.resourceGroupName }}" --query "[0].loginServer" -o tsv)
                API_FQDN=$(az containerapp show --resource-group "${{ parameters.resourceGroupName }}" \
                  --name "$(az containerapp list --resource-group "${{ parameters.resourceGroupName }}" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)

                echo "Resolved ACR: $ACR_NAME ($ACR_LOGIN_SERVER)"
                echo "Resolved existing API Container App FQDN: $API_FQDN"
                echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$ACR_LOGIN_SERVER"

                az acr login --name "$ACR_NAME"

                echo "=== Building API image (repo-root build context — see apps/api/Dockerfile) ==="
                echo "Build metadata: APP_VERSION=$(appVersion) BUILD_NUMBER=$(Build.BuildNumber) COMMIT_SHA=$(Build.SourceVersion)"
                docker build \
                  --file apps/api/Dockerfile \
                  --build-arg APP_VERSION="$(appVersion)" \
                  --build-arg BUILD_NUMBER="$(Build.BuildNumber)" \
                  --build-arg COMMIT_SHA="$(Build.SourceVersion)" \
                  -t "$ACR_LOGIN_SERVER/$(apiImageName):$(imageTag)" \
                  .

                echo "=== Pushing API image ==="
                docker push "$ACR_LOGIN_SERVER/$(apiImageName):$(imageTag)"

                # PBI-14-11: resolve the immutable digest ACR assigned this push, so DeployDev can
                # deploy `image@sha256:...` rather than the mutable `image:tag` reference — ACR at
                # this SKU does not enforce tag immutability, so pinning by digest removes any
                # reliance on a tag never being overwritten with different content after this run.
                API_IMAGE_DIGEST=$(az acr repository show --name "$ACR_NAME" --image "$(apiImageName):$(imageTag)" --query digest -o tsv)
                echo "API image digest: $API_IMAGE_DIGEST"
                echo "##vso[task.setvariable variable=apiImageDigest;isOutput=true]$API_IMAGE_DIGEST"

                # VITE_API_URL is baked into the Web image at build time (Vite inlines VITE_*
                # vars at build, not container runtime — docs/sprint_00/decisions.md,
                # PBI-00-03). The DEV API Container App already exists and is already running
                # (this PBI's explicit context), so its FQDN is resolved directly above rather
                # than waiting on a fresh deployment's output, unlike the original disabled
                # Deploy_Dev stage's documented (from-scratch) assumption.
                #
                # PBI-14-05: the Web image is now built and pushed on EVERY main deploy run,
                # unconditionally — never skipped based on whether apps/web changed in this
                # specific commit. This guarantees API and Web always ship from the same
                # pipeline run, tagged with the same $(imageTag), even when apps/web's own
                # source is unchanged (its build still picks up VITE_API_URL fresh each run,
                # and — more importantly — this is what keeps DEV's Web Container App from
                # silently drifting behind whatever main actually contains).
                echo "=== Building Web image (always; context apps/web, VITE_API_URL=https://$API_FQDN) ==="
                echo "Build metadata: VITE_APP_VERSION=$(appVersion) VITE_BUILD_NUMBER=$(Build.BuildNumber) VITE_COMMIT_SHA=$(Build.SourceVersion)"
                docker build \
                  --build-arg VITE_API_URL="https://$API_FQDN" \
                  --build-arg VITE_APP_VERSION="$(appVersion)" \
                  --build-arg VITE_BUILD_NUMBER="$(Build.BuildNumber)" \
                  --build-arg VITE_COMMIT_SHA="$(Build.SourceVersion)" \
                  -t "$ACR_LOGIN_SERVER/$(webImageName):$(imageTag)" \
                  apps/web

                echo "=== Pushing Web image ==="
                docker push "$ACR_LOGIN_SERVER/$(webImageName):$(imageTag)"

                # PBI-14-11: same digest resolution as the API image above.
                WEB_IMAGE_DIGEST=$(az acr repository show --name "$ACR_NAME" --image "$(webImageName):$(imageTag)" --query digest -o tsv)
                echo "Web image digest: $WEB_IMAGE_DIGEST"
                echo "##vso[task.setvariable variable=webImageDigest;isOutput=true]$WEB_IMAGE_DIGEST"
            name: buildAndPush

  # ============================================================================================
  # PBI-07-01 STAGE 5 — Deploy DEV
  # Updates ONLY the two existing Container Apps' image reference — never
  # `az deployment group create`/`what-if`, never touches Cosmos DB, Key Vault, Azure OpenAI,
  # AI Search, the Managed Identity, or the registry's own management plane. The image tag is
  # unique per pipeline run (Build.BuildId + commit-SHA-derived), so Azure Container Apps always
  # creates a genuine new revision — no `--revision-suffix` workaround needed (that was only
  # required in PBI-03-05/06's manual validation, which reused a fixed
  # "pending-first-build" tag). Deliberately does NOT dependsOn InfrastructureDeploy — API/Web
  # delivery must never be blocked by an infrastructure-only issue (the still-open Function App
  # quota block, or the new Infrastructure-deploy RBAC not being granted yet).
  #
  # PBI-14-05: both Container Apps are now updated on EVERY main deploy run, unconditionally —
  # see ContainerBuildAndPush's own PBI-14-05 comment for why the previous "skip Web when
  # apps/web didn't change in this commit" behavior caused DEV to silently drift to a stale Web
  # image, one commit at a time, whenever a main push's own diff happened not to touch
  # apps/web. Since ContainerBuildAndPush now always builds/pushes both images with the same
  # $(imageTag), always deploying both here is what actually keeps API and Web coherent.
  # ============================================================================================
  - stage: DeployDev
    displayName: '5 - Deploy DEV (existing Container Apps only — API and Web, always both)'
    dependsOn:
      - ContainerBuildAndPush
      - InfrastructureValidation
      # InfrastructureDeploy (PBI-14-08): sequencing-only dependency, deliberately NOT gated on
      # in the condition below. ops/bicep/parameters/dev.bicepparam hardcodes
      # apiImageTag/webImageTag='pending-first-build', and ops/bicep/modules/container-app.bicep
      # declares the Container Apps as full (non-`existing`) resources whose image is bound
      # directly to that parameter — so every `az deployment group create` run resets both
      # Container Apps back to that placeholder. Before this dependsOn entry,
      # InfrastructureDeploy and DeployDev were unsequenced siblings of InfrastructureValidation,
      # so their relative finish order was scheduler-dependent: build #50's real pipeline run
      # (dev-50-321ce9f...) proved InfrastructureDeploy can finish AFTER DeployDev, silently
      # reverting the just-correctly-deployed image back to pending-first-build (confirmed via
      # Azure DevOps Timeline API: stage 5 finished at 23:14:37Z, stage 4b at 23:17:50Z, then
      # Smoke Tests caught the drift at 23:18:25Z) — see docs/sprint_14/decisions.md (PBI-14-08).
      # Listing it here forces Azure DevOps to wait for InfrastructureDeploy to reach a terminal
      # state before DeployDev starts, so DeployDev's own image update always runs last and
      # always wins, deterministically, regardless of scheduling order.
      - InfrastructureDeploy
    # PBI-14-08: explicit per-dependency checks, not bare succeeded() — succeeded() would also
    # start requiring InfrastructureDeploy's OWN result now that it's listed above, which would
    # reintroduce exactly the "infra issues block DEV delivery" problem this stage's original
    # design (see the stage-level comment block above) explicitly rejects. InfrastructureDeploy's
    # result (succeeded / partial-quota-blocked / failed) is intentionally never checked here —
    # mirrors the identical, already-established pattern DeploymentSummary uses for the same
    # dependency below.
    condition: >
      and(
        eq(variables.isDeployRun, true),
        in(dependencies.ContainerBuildAndPush.result, 'Succeeded'),
        in(dependencies.InfrastructureValidation.result, 'Succeeded')
      )
    variables:
      apiImageDigest: $[ stageDependencies.ContainerBuildAndPush.ContainerBuildAndPushJob.outputs['buildAndPush.apiImageDigest'] ]
      webImageDigest: $[ stageDependencies.ContainerBuildAndPush.ContainerBuildAndPushJob.outputs['buildAndPush.webImageDigest'] ]
    jobs:
      - job: DeployDevJob
        displayName: Update DEV Container App revisions
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: 'az containerapp update — API and Web, always both (image only, no infra recreation)'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                ACR_LOGIN_SERVER=$(az acr list --resource-group "${{ parameters.resourceGroupName }}" --query "[0].loginServer" -o tsv)
                API_APP_NAME=$(az containerapp list --resource-group "${{ parameters.resourceGroupName }}" --query "[?ends_with(name, '-api')].name | [0]" -o tsv)
                WEB_APP_NAME=$(az containerapp list --resource-group "${{ parameters.resourceGroupName }}" --query "[?ends_with(name, '-web')].name | [0]" -o tsv)

                # PBI-14-11: deploy by the immutable digest ContainerBuildAndPush resolved right
                # after pushing, not the mutable tag — this is the one stage authorized to change
                # what image these Container Apps run, and it now pins that change to an exact,
                # non-reassignable content digest rather than a tag ACR (Basic/Standard SKU, no
                # tag-immutability policy support) does not itself guarantee is stable.
                echo "Updating $API_APP_NAME -> $ACR_LOGIN_SERVER/$(apiImageName)@$(apiImageDigest)"
                az containerapp update \
                  --name "$API_APP_NAME" \
                  --resource-group "${{ parameters.resourceGroupName }}" \
                  --image "$ACR_LOGIN_SERVER/$(apiImageName)@$(apiImageDigest)"

                echo "Updating $WEB_APP_NAME -> $ACR_LOGIN_SERVER/$(webImageName)@$(webImageDigest)"
                az containerapp update \
                  --name "$WEB_APP_NAME" \
                  --resource-group "${{ parameters.resourceGroupName }}" \
                  --image "$ACR_LOGIN_SERVER/$(webImageName)@$(webImageDigest)"

                API_REVISION=$(az containerapp show --name "$API_APP_NAME" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.latestRevisionName" -o tsv)
                WEB_REVISION=$(az containerapp show --name "$WEB_APP_NAME" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.latestRevisionName" -o tsv)
                API_FQDN=$(az containerapp show --name "$API_APP_NAME" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.configuration.ingress.fqdn" -o tsv)
                WEB_FQDN=$(az containerapp show --name "$WEB_APP_NAME" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.configuration.ingress.fqdn" -o tsv)
                API_DEPLOYED_IMAGE=$(az containerapp show --name "$API_APP_NAME" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.template.containers[0].image" -o tsv)
                WEB_DEPLOYED_IMAGE=$(az containerapp show --name "$WEB_APP_NAME" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.template.containers[0].image" -o tsv)

                echo "API revision: $API_REVISION ($API_DEPLOYED_IMAGE)"
                echo "Web revision: $WEB_REVISION ($WEB_DEPLOYED_IMAGE)"
                echo "##vso[task.setvariable variable=apiAppName;isOutput=true]$API_APP_NAME"
                echo "##vso[task.setvariable variable=webAppName;isOutput=true]$WEB_APP_NAME"
                echo "##vso[task.setvariable variable=apiRevision;isOutput=true]$API_REVISION"
                echo "##vso[task.setvariable variable=webRevision;isOutput=true]$WEB_REVISION"
                echo "##vso[task.setvariable variable=apiFqdn;isOutput=true]$API_FQDN"
                echo "##vso[task.setvariable variable=webFqdn;isOutput=true]$WEB_FQDN"
                echo "##vso[task.setvariable variable=apiDeployedImage;isOutput=true]$API_DEPLOYED_IMAGE"
                echo "##vso[task.setvariable variable=webDeployedImage;isOutput=true]$WEB_DEPLOYED_IMAGE"
                # Re-published (not just consumed) so SmokeTests — which only depends on
                # DeployDev, not ContainerBuildAndPush directly — can read the exact digest this
                # run deployed, the same way it already reads apiFqdn/webFqdn/apiAppName/webAppName
                # below.
                echo "##vso[task.setvariable variable=apiImageDigestOut;isOutput=true]$(apiImageDigest)"
                echo "##vso[task.setvariable variable=webImageDigestOut;isOutput=true]$(webImageDigest)"
            name: deploy

  # ============================================================================================
  # PBI-07-01 STAGE 6 — Smoke Tests
  # Checks against the just-updated, real DEV API and Web Container Apps: deployed API image
  # tag matches this run; deployed Web image tag matches this run (PBI-14-05 — the exact check
  # that would have caught the stale-Web drift this PBI fixes, had it existed before); deployed
  # API reports the expected build_number/commit_sha via GET /version, and the deployed Web
  # bundle contains the expected commit SHA (PBI-14-06 — catches the case where the *image tag*
  # updated but the running application somehow still serves stale content, e.g. a caching
  # layer or a container that didn't actually restart); GET /health; POST /chat with a real
  # Claims-triggering message, asserting X-Correlation-ID is echoed back unchanged; a second
  # POST /chat reusing the same conversationId (continuity). `curl -f`/explicit `exit 1` on any
  # check failure fails this step, which fails this stage, which blocks the summary stage —
  # "pipeline must fail if smoke tests fail" / "a deployment must not be considered successful
  # if Azure is still serving an older application build" with no extra error-handling code
  # needed. Uses the existing synthetic policy SYN-POL-0001
  # (src/services/tools/synthetic/provider.py) — never real customer data.
  # ============================================================================================
  - stage: SmokeTests
    displayName: '6 - Smoke Tests'
    dependsOn:
      - DeployDev
    condition: and(succeeded(), eq(variables.isDeployRun, true))
    variables:
      apiFqdn: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiFqdn'] ]
      webFqdn: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webFqdn'] ]
      apiAppName: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiAppName'] ]
      webAppName: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webAppName'] ]
      apiImageDigest: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiImageDigestOut'] ]
      webImageDigest: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webImageDigestOut'] ]
    jobs:
      - job: SmokeTestsJob
        displayName: Run smoke tests against the deployed DEV API and Web apps
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: 'Smoke test 1/7: verify deployed API image digest (PBI-14-11 — pinned by digest, not mutable tag)'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                DEPLOYED_IMAGE=$(az containerapp show --name "$(apiAppName)" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.template.containers[0].image" -o tsv)
                ACR_NAME=$(az acr list --resource-group "${{ parameters.resourceGroupName }}" --query "[0].name" -o tsv)
                ACR_DIGEST=$(az acr repository show --name "$ACR_NAME" --image "$(apiImageName):$(imageTag)" --query digest -o tsv)
                EXPECTED_IMAGE_SUFFIX="$(apiImageName)@$ACR_DIGEST"
                echo "Deployed API image:           $DEPLOYED_IMAGE"
                echo "This run's tag ($(imageTag)) currently maps in ACR to digest: $ACR_DIGEST"
                echo "Digest DeployDev deployed:     $(apiImageDigest)"
                if [ "$ACR_DIGEST" != "$(apiImageDigest)" ]; then
                  echo "MISMATCH: ACR now reports a different digest for this run's tag than the digest DeployDev actually deployed — mutable-tag drift between build and deploy (ACR at this SKU does not enforce tag immutability)."
                  exit 1
                fi
                case "$DEPLOYED_IMAGE" in
                  *"$EXPECTED_IMAGE_SUFFIX")
                    echo "Deployed API image matches this pipeline run's digest: OK" ;;
                  *)
                    echo "MISMATCH: the live API Container App is not running the digest this run just built and deployed."
                    exit 1 ;;
                esac

          - task: AzureCLI@2
            displayName: 'Smoke test 2/7: verify deployed Web image digest (PBI-14-05/PBI-14-11 — catches stale-Web drift, pinned by digest)'
            inputs:
              azureSubscription: '${{ parameters.azureServiceConnection }}'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                DEPLOYED_IMAGE=$(az containerapp show --name "$(webAppName)" --resource-group "${{ parameters.resourceGroupName }}" --query "properties.template.containers[0].image" -o tsv)
                ACR_NAME=$(az acr list --resource-group "${{ parameters.resourceGroupName }}" --query "[0].name" -o tsv)
                ACR_DIGEST=$(az acr repository show --name "$ACR_NAME" --image "$(webImageName):$(imageTag)" --query digest -o tsv)
                EXPECTED_IMAGE_SUFFIX="$(webImageName)@$ACR_DIGEST"
                echo "Deployed Web image:           $DEPLOYED_IMAGE"
                echo "This run's tag ($(imageTag)) currently maps in ACR to digest: $ACR_DIGEST"
                echo "Digest DeployDev deployed:     $(webImageDigest)"
                if [ "$ACR_DIGEST" != "$(webImageDigest)" ]; then
                  echo "MISMATCH: ACR now reports a different digest for this run's tag than the digest DeployDev actually deployed — mutable-tag drift between build and deploy (ACR at this SKU does not enforce tag immutability)."
                  exit 1
                fi
                case "$DEPLOYED_IMAGE" in
                  *"$EXPECTED_IMAGE_SUFFIX")
                    echo "Deployed Web image matches this pipeline run's digest: OK" ;;
                  *)
                    echo "MISMATCH: the live Web Container App is not running the digest this run just built and deployed — this is exactly the DEV drift PBI-14-05 fixes; if this fires, DeployDev's unconditional Web update did not actually take effect."
                    exit 1 ;;
                esac

          - script: |
              set -e
              echo "Smoke test 3/7: verify deployed API reports the expected build/commit via GET /version"
              VERSION_BODY=$(curl -sf --max-time 30 "https://$(apiFqdn)/version")
              echo "$VERSION_BODY"
              echo "$VERSION_BODY" | python3 -c "
              import json, sys
              body = json.load(sys.stdin)
              expected_build = '$(Build.BuildNumber)'
              expected_commit = '$(Build.SourceVersion)'
              actual_build = body.get('build_number')
              actual_commit = body.get('commit_sha')
              print(f'Deployed API build_number={actual_build!r} commit_sha={actual_commit!r}')
              print(f'Expected build_number={expected_build!r} commit_sha={expected_commit!r}')
              assert actual_build == expected_build, f'API build_number mismatch: expected {expected_build!r}, got {actual_build!r} — Azure may still be serving an older build.'
              assert actual_commit == expected_commit, f'API commit_sha mismatch: expected {expected_commit!r}, got {actual_commit!r} — Azure may still be serving an older build.'
              print('Deployed API build/commit identity: OK')
              "
            displayName: 'Smoke test 3/7: verify deployed API build/commit identity (GET /version)'

          - script: |
              set -e
              echo "Smoke test 4/7: verify deployed Web build identity (commit SHA present in served bundle)"
              INDEX_HTML=$(curl -sf --max-time 30 "https://$(webFqdn)/")
              JS_ASSET_PATH=$(echo "$INDEX_HTML" | grep -oE '/assets/[^"'"'"']+\.js' | head -1)
              if [ -z "$JS_ASSET_PATH" ]; then
                echo "MISMATCH: could not locate a built JS asset reference in the deployed Web app's index page."
                exit 1
              fi
              echo "Checking bundle: https://$(webFqdn)$JS_ASSET_PATH for commit $(Build.SourceVersion)"
              if curl -sf --max-time 30 "https://$(webFqdn)$JS_ASSET_PATH" | grep -qF "$(Build.SourceVersion)"; then
                echo "Deployed Web build/commit identity: OK (commit found in bundle)"
              else
                echo "MISMATCH: the deployed Web bundle does not contain this run's commit SHA — Azure may still be serving an older build."
                exit 1
              fi
            displayName: 'Smoke test 4/7: verify deployed Web build/commit identity (bundle contains expected commit)'

          - script: |
              set -e
              echo "Smoke test 5/7: GET https://$(apiFqdn)/health"
              curl -sf --max-time 30 "https://$(apiFqdn)/health"
              echo ""
              echo "GET /health: OK"
            displayName: 'Smoke test 5/7: GET /health'

          - script: |
              set -e
              echo "Smoke test 6/7: POST /chat, turn 1 — Claims scenario + correlation ID"
              CORR_ID="cicd-smoke-$(Build.BuildId)"
              HEADERS_FILE=$(mktemp)
              BODY=$(curl -sf --max-time 60 -D "$HEADERS_FILE" -X POST "https://$(apiFqdn)/chat" \
                -H "Content-Type: application/json" \
                -H "X-Correlation-ID: $CORR_ID" \
                -d '{"userId":"cicd-smoke-test","message":"I need to report a claim for policy SYN-POL-0001."}')
              echo "$BODY"

              CONVERSATION_ID=$(echo "$BODY" | python3 -c "
              import json, sys
              body = json.load(sys.stdin)
              assert body.get('response'), 'POST /chat returned no response text'
              assert body.get('agent'), 'POST /chat returned no agent'
              assert body.get('conversationId'), 'POST /chat returned no conversationId'
              assert body.get('agent') == 'ClaimsAgent', f\"expected ClaimsAgent for a claim-report message, got {body.get('agent')!r}\"
              print(f\"POST /chat turn 1: OK (agent={body['agent']}, intent={body.get('intent')}, conversationId={body['conversationId']})\", file=sys.stderr)
              print(body['conversationId'])
              ")
              echo "##vso[task.setvariable variable=conversationId]$CONVERSATION_ID"

              RETURNED_CORR_ID=$(grep -i '^x-correlation-id:' "$HEADERS_FILE" | tr -d '\r' | awk '{print $2}')
              echo "Sent correlation ID:     $CORR_ID"
              echo "Received correlation ID: $RETURNED_CORR_ID"
              if [ "$CORR_ID" != "$RETURNED_CORR_ID" ]; then
                echo "MISMATCH: X-Correlation-ID was not echoed back unchanged."
                exit 1
              fi
              echo "Correlation ID propagation: OK"
            displayName: 'Smoke test 6/7: POST /chat — Claims scenario + correlation ID (turn 1)'

          - script: |
              set -e
              echo "Smoke test 7/7: POST /chat, turn 2 — conversation continuity"
              BODY2=$(curl -sf --max-time 60 -X POST "https://$(apiFqdn)/chat" \
                -H "Content-Type: application/json" \
                -d "{\"userId\":\"cicd-smoke-test\",\"conversationId\":\"$(conversationId)\",\"message\":\"Never mind, thank you.\"}")
              echo "$BODY2"
              echo "$BODY2" | python3 -c "
              import json, sys
              body = json.load(sys.stdin)
              assert body.get('response'), 'POST /chat (turn 2) returned no response text'
              expected = '$(conversationId)'
              actual = body.get('conversationId')
              assert actual == expected, f'conversationId changed mid-conversation: expected {expected!r}, got {actual!r}'
              print(f\"POST /chat turn 2: OK (conversationId preserved: {actual})\")
              "
              echo "Conversation continuity: OK"
            displayName: 'Smoke test 7/7: POST /chat — conversation continuity (turn 2, same conversationId)'

  # ============================================================================================
  # PBI-07-01 STAGE 7 (bonus, beyond this PBI's own 6-stage list) — Deployment Summary
  # Publishes image tags, deployed Container App names/revisions/ACTUAL deployed image
  # references, execution time, a test summary (parsed from the backend/frontend JUnit
  # artifacts already published in Stages 1-2), and the Infrastructure-deploy outcome as a
  # single pipeline artifact and build-summary markdown. Deliberately depends on
  # InfrastructureDeploy for ordering/output access but does NOT require it to have succeeded
  # (see the explicit `dependencies.InfrastructureDeploy.result` check below, not the blanket
  # `succeeded()` the other dependencies use) — this summary must still publish even when infra
  # deploy hit the known, non-blocking quota condition (which itself already exits 0 — see that
  # stage) or any other infra-only issue, consistent with "must not incorrectly mark unrelated
  # API/Web delivery as failed."
  #
  # PBI-14-05: both the API and Web sections below are now UNCONDITIONAL (both images are
  # always built/pushed/deployed this run — see ContainerBuildAndPush/DeployDev's own PBI-14-05
  # comments) and each is verified against $(imageTag) directly from the actual deployed image
  # reference DeployDev captured (`apiDeployedImage`/`webDeployedImage`), not merely asserted —
  # this is the same evidence Smoke Tests 1/5 and 2/5 already independently verify, surfaced
  # here too so the summary is self-contained proof, not just a restatement of intent.
  # ============================================================================================
  - stage: DeploymentSummary
    displayName: '7 (bonus) - Deployment Summary'
    dependsOn:
      - SmokeTests
      - DeployDev
      - ContainerBuildAndPush
      - InfrastructureDeploy
    condition: >
      and(
        eq(variables.isDeployRun, true),
        in(dependencies.SmokeTests.result, 'Succeeded'),
        in(dependencies.DeployDev.result, 'Succeeded'),
        in(dependencies.ContainerBuildAndPush.result, 'Succeeded')
      )
    variables:
      apiAppName: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiAppName'] ]
      webAppName: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webAppName'] ]
      apiRevision: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiRevision'] ]
      webRevision: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webRevision'] ]
      apiFqdn: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiFqdn'] ]
      webFqdn: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webFqdn'] ]
      apiDeployedImage: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.apiDeployedImage'] ]
      webDeployedImage: $[ stageDependencies.DeployDev.DeployDevJob.outputs['deploy.webDeployedImage'] ]
      webChangedInfoOnly: $[ stageDependencies.ContainerBuildAndPush.ContainerBuildAndPushJob.outputs['detectWebChange.webChangedInfoOnly'] ]
      infraDeployResult: $[ stageDependencies.InfrastructureDeploy.InfrastructureDeployJob.outputs['infraDeploy.infraDeployResult'] ]
    jobs:
      - job: DeploymentSummaryJob
        displayName: Publish deployment summary
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: backend-reports
              path: '$(Pipeline.Workspace)/backend-reports'
            displayName: 'Download backend test results'

          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: frontend-reports
              path: '$(Pipeline.Workspace)/frontend-reports'
            displayName: 'Download frontend test results'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/deployment-summary"

              BACKEND_SUMMARY=$(python3 -c "
              import xml.etree.ElementTree as ET
              try:
                  root = ET.parse('$(Pipeline.Workspace)/backend-reports/junit.xml').getroot()
                  suite = root if root.tag == 'testsuite' else root.find('testsuite')
                  print(f\"{suite.get('tests')} tests, {suite.get('failures', 0)} failures, {suite.get('errors', 0)} errors, {suite.get('skipped', 0)} skipped\")
              except Exception as exc:
                  print(f'unavailable ({exc})')
              ")
              FRONTEND_SUMMARY=$(python3 -c "
              import xml.etree.ElementTree as ET
              try:
                  root = ET.parse('$(Pipeline.Workspace)/frontend-reports/junit.xml').getroot()
                  suite = root if root.tag == 'testsuite' else root.find('testsuite')
                  print(f\"{suite.get('tests')} tests, {suite.get('failures', 0)} failures, {suite.get('errors', 0)} errors, {suite.get('skipped', 0)} skipped\")
              except Exception as exc:
                  print(f'unavailable ({exc})')
              ")

              # Build.QueueTime is a standard Azure Pipelines predefined variable (ISO 8601).
              QUEUE_EPOCH=$(date -d "$(Build.QueueTime)" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date +%s)
              if [ "$QUEUE_EPOCH" != "0" ]; then
                ELAPSED=$((NOW_EPOCH - QUEUE_EPOCH))
                EXEC_TIME="${ELAPSED}s (from pipeline queue time to this summary step; exact per-stage timings are in the Azure DevOps run's own Timeline view)"
              else
                EXEC_TIME="see the Azure DevOps run's own Timeline view"
              fi

              {
                echo "# TMX Platform — Deployment Summary"
                echo ""
                echo "- **Build:** $(Build.BuildId)  **Commit:** $(Build.SourceVersion)  **Branch:** $(Build.SourceBranchName)"
                echo "- **Execution time:** $EXEC_TIME"
                echo ""
                echo "## Image tags (PBI-14-05: both images always built and pushed this run)"
                echo "- API: \`$(apiImageName):$(imageTag)\`"
                echo "- Web: \`$(webImageName):$(imageTag)\`"
                echo "- (informational only, does not affect this run: apps/web changed since parent commit = $(webChangedInfoOnly))"
                echo ""
                echo "## Deployed Container Apps (PBI-14-05: both always updated this run)"
                echo "- API: \`$(apiAppName)\` — revision \`$(apiRevision)\` — https://$(apiFqdn)"
                echo "  - Deployed image: \`$(apiDeployedImage)\`"
                echo "- Web: \`$(webAppName)\` — revision \`$(webRevision)\` — https://$(webFqdn)"
                echo "  - Deployed image: \`$(webDeployedImage)\`"
                echo ""
                echo "## Image tag consistency check"
                case "$(apiDeployedImage)" in
                  *"$(apiImageName):$(imageTag)") API_TAG_OK="yes" ;;
                  *) API_TAG_OK="NO — MISMATCH" ;;
                esac
                case "$(webDeployedImage)" in
                  *"$(webImageName):$(imageTag)") WEB_TAG_OK="yes" ;;
                  *) WEB_TAG_OK="NO — MISMATCH" ;;
                esac
                echo "- API deployed image matches this run's \$(imageTag): $API_TAG_OK"
                echo "- Web deployed image matches this run's \$(imageTag): $WEB_TAG_OK"
                echo "(Smoke Tests 1/7 and 2/7 already independently verified and gated on both of these — this section restates the evidence for the summary artifact, it does not re-decide pass/fail.)"
                echo ""
                echo "## Build/deployment traceability (PBI-14-06)"
                echo "- API image: \`$(apiDeployedImage)\`"
                echo "- API commit: \`$(Build.SourceVersion)\`"
                echo "- API revision: \`$(apiRevision)\`"
                echo "- Web image: \`$(webDeployedImage)\`"
                echo "- Web commit: \`$(Build.SourceVersion)\`"
                echo "- Web revision: \`$(webRevision)\`"
                echo "- Expected source commit: \`$(Build.SourceVersion)\`"
                echo "- Both images were built from this same pipeline run (\$(Build.BuildNumber)) with the same --build-arg COMMIT_SHA/VITE_COMMIT_SHA — API and Web can never diverge in which commit they were built from."
                echo "- Smoke Tests 3/7 and 4/7 already independently verified the DEPLOYED (not just built) API/Web report this exact commit — this section restates that evidence, it does not re-decide pass/fail."
                echo ""
                echo "## Infrastructure (Bicep) deploy — Stage 4b"
                case "$(infraDeployResult)" in
                  succeeded)
                    echo "- Full main.bicep deploy succeeded, including the Claims Tool Layer Function App." ;;
                  partial-quota-blocked)
                    echo "- PARTIAL (expected): every resource except the Claims Tool Layer Function App applied successfully. The Function App (Microsoft.Web/serverFarms) is blocked by a known, external, documented Azure subscription App Service quota limitation (SubscriptionIsOverQuotaForSku) — NOT a pipeline, Bicep, or application defect. See docs/Architecture/adr/0003-azure-functions-tool-and-workflow-layer.md and docs/sprint_06/decisions.md D-07. Does not affect anything above (API/Web are independently delivered)." ;;
                  failed)
                    echo "- FAILED for a reason other than the known quota block — needs investigation (see the InfrastructureDeploy stage's own log). Did not block API/Web delivery above." ;;
                  *)
                    echo "- Not run or result unavailable (\`$(infraDeployResult)\`) — see the InfrastructureDeploy stage directly." ;;
                esac
                echo ""
                echo "## Smoke tests (Stage 6)"
                echo "- Deployed API image tag verified: passed"
                echo "- Deployed Web image tag verified: passed (PBI-14-05)"
                echo "- GET /health: passed"
                echo "- POST /chat (Claims scenario + correlation ID, turn 1): passed"
                echo "- POST /chat (conversation continuity, turn 2): passed"
                echo "(pipeline would have failed otherwise — see Stage 6's own steps for full output)"
                echo ""
                echo "## Test summary"
                echo "- Backend (pytest): $BACKEND_SUMMARY"
                echo "- Frontend (Vitest): $FRONTEND_SUMMARY"
                echo "- Security scan reports: see the security-reports pipeline artifact (Stage 2)"
              } | tee "$(Build.ArtifactStagingDirectory)/deployment-summary/DEPLOYMENT-SUMMARY.md"

              # Also surface it directly on the Azure DevOps run summary page.
              echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/deployment-summary/DEPLOYMENT-SUMMARY.md"
            displayName: 'Generate deployment summary'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/deployment-summary'
              artifactName: 'deployment-summary'
            displayName: 'Publish deployment-summary artifact'

  # ============================================================================================
  # ArtifactPublication — validation-only summary (Bicep/IaC content), unchanged in purpose
  # from Sprint 0. Runs on every pipeline execution (PR against main, or a push to main —
  # feat/*/fix/*/review/* branches no longer trigger a run on their own), not gated by
  # isDeployRun, since it documents what was VALIDATED, not what was deployed —
  # DeploymentSummary above is the deploy-specific counterpart, only meaningful on an actual
  # deploy run.
  # ============================================================================================
  - stage: ArtifactPublication
    displayName: 'Artifact Publication (validation summary, every run)'
    dependsOn:
      - InfrastructureValidation
    jobs:
      - job: ArtifactPublicationJob
        displayName: Publish IaC and summary artifacts
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'ops/bicep'
              artifactName: 'bicep-templates'
            displayName: 'Publish Bicep/IaC content'

          - script: |
              set -e
              mkdir -p "$(Build.ArtifactStagingDirectory)/summary"
              {
                echo "# Pipeline validation summary"
                echo "Build: $(Build.BuildId)  Commit: $(Build.SourceVersion)  Branch: $(Build.SourceBranchName)"
                echo ""
                echo "- Backend quality: tests, ruff, mypy — see the backend-reports artifact"
                echo "- Frontend quality: lint, typecheck, tests, build — see frontend-reports / web-build artifacts"
                echo "- Security: pip-audit, npm audit (production deps), detect-secrets — see the security-reports artifact"
                echo "- Infrastructure: all Bicep modules, main.bicep, and dev/staging/prod parameter files compiled"
                echo ""
                echo "Deployment to DEV runs only for pushes to '${{ parameters.deployBranch }}' — see the"
                echo "deployment-summary artifact (DeploymentSummary stage) on those runs."
              } > "$(Build.ArtifactStagingDirectory)/summary/PIPELINE-SUMMARY.md"
            displayName: 'Generate validation summary'

          - task: PublishPipelineArtifact@1
